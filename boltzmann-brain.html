<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Thought Experiment 002 - Bolzmann Brain</title>
<link rel="stylesheet" href="./template.css" />
<style>
  /* 이 페이지(볼츠만 두뇌)만의 스타일 - 공통 껍데기는 template.css에 있음 */
  canvas { display: block; }

  /* ---------- 시작 화면 / 본 화면 ----------
     시작 전: 문구만 보임. 화면을 클릭하면 문구가 사라지고 본 화면(캔버스, 패널)이 나타남 */
  canvas, #panel { opacity: 0; transition: opacity 1.2s ease; }
  #panel { pointer-events: none; }
  body.started canvas, body.started #panel { opacity: 1; }
  body.started #panel { pointer-events: auto; }

  #introText {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: beige;
    font-family: serif;
    text-align: center;
    font-size: 18px;
    line-height: 1.9;
    z-index: 5;
    transition: opacity 0.6s ease;
    pointer-events: none;
    word-break: keep-all;
  }

  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(20, 22, 30, 0.85);
    color: #eee;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    z-index: 10;
    max-width: 300px;
    font-family: serif;
  }
</style>
</head>
<body>

<div id="introText">
  아무것도 없는 공간(진공)에서도<br>
  쌍생성과 쌍소멸이 끝없이 반복된다.<br>
  아주 낮은 확률로, 그 요동만으로<br>
  지능을 가진 뇌가 나타났다 사라질 수도 있다.<br>
  우리는 우주에 나타난 뇌일까, 아니면 실제로 존재하는 걸까. <br>
  <br>
  (화면을 클릭하면 시작합니다)
</div>

<div id="panel">진공 포켓: 0개</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<!-- 공통 템플릿(제목바/목차) -->
<script src="./template.js"></script>

<!-- 함수 파일 -->
<script src="./boltzmann-brain.js"></script>
<script src="./boltzmann-brain-shape.js"></script>
<script src="./boltzmann-brain-scene.js"></script>

<script>
  initPageTemplate({ title: "Thought Experiment 0 0 2 - Bolzmann Brain", activeId: 2 });

  // ---------- 시작 화면: 첫 클릭 -> 문구가 사라지고 본 화면이 나타남 ----------
  // 첫 클릭은 시작에만 쓰이고, 아래의 클릭/드래그/휠 동작으로는 전달되지 않음
  let started = false;
  let swallowMouseUp = false;
  function isTemplateUi(target) {
    return target && target.closest && target.closest('#menuToggleBtn, #tocSidebar');
  }
  window.addEventListener('mousedown', (event) => {
    if (started || isTemplateUi(event.target)) return;
    event.stopImmediatePropagation();
    if (event.button !== 0) return;
    started = true;
    swallowMouseUp = true;
    const introEl = document.getElementById('introText');
    introEl.style.opacity = '0';
    setTimeout(() => { introEl.style.display = 'none'; }, 650);
    document.body.classList.add('started');
  }, true);
  window.addEventListener('mouseup', (event) => {
    if (!swallowMouseUp) return;
    swallowMouseUp = false;
    event.stopImmediatePropagation();
  }, true);
  window.addEventListener('wheel', (event) => {
    if (!started) event.stopImmediatePropagation();
  }, true);

  // ---------- 기본 씬 세팅 ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 380);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- 클릭(진공 포켓 생성) / 드래그(공간 회전) ----------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const panelEl = document.getElementById('panel');
  const introTextEl = document.getElementById('introText');
  let pocketCount = 0;

  function spawnPocketAtEvent(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    // 클릭한 레이가 뇌 볼륨을 지나는 구간의 한가운데를 진공 포켓 중심으로 사용 (뇌 밖이면 null)
    const point = findPocketCenterFromRay_BoltzmannBrain(raycaster.ray);
    if (!point) return; // 범위 밖 클릭 -> 아무 일도 일어나지 않음

    const created = spawnVacuumPocket_BoltzmannBrain(point, elapsedTime);
    if (!created) return; // 필드 범위 밖 클릭 -> 아무 일도 일어나지 않음

    pocketCount++;
    panelEl.textContent = `진공 포켓: ${pocketCount}개`;

    if (introTextEl.style.display !== 'none') {
      introTextEl.style.opacity = '0';
      setTimeout(() => { introTextEl.style.display = 'none'; }, 650);
    }
  }

  // 좌클릭 드래그 = 공간(0,0,0 중심) 회전, 거의 움직이지 않았으면 클릭(진공 포켓 생성)
  let isDragging = false;
  let dragDistanceAccum = 0;
  let lastPointerX = 0;
  let lastPointerY = 0;
  let spaceRotY = 0;
  let spaceRotX = 0;
  const CLICK_DRAG_THRESHOLD = 5; // 픽셀

  renderer.domElement.addEventListener('mousedown', (event) => {
    if (event.button !== 0) return;
    isDragging = true;
    dragDistanceAccum = 0;
    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
  });

  window.addEventListener('mousemove', (event) => {
    if (!isDragging) return;
    const dx = event.clientX - lastPointerX;
    const dy = event.clientY - lastPointerY;
    dragDistanceAccum += Math.abs(dx) + Math.abs(dy);

    spaceRotY += dx * 0.006;
    spaceRotX += dy * 0.006;

    const root = getSceneRoot_BoltzmannBrain();
    if (root) {
      // 그룹 자체가 원점(0,0,0)에 위치해 있으므로, 회전은 자동으로 원점을 중심으로 일어남
      root.rotation.y = spaceRotY;
      root.rotation.x = spaceRotX;
    }

    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
  });

  window.addEventListener('mouseup', (event) => {
    if (event.button !== 0) return;
    if (isDragging && dragDistanceAccum < CLICK_DRAG_THRESHOLD) {
      spawnPocketAtEvent(event); // 드래그가 거의 없었으면 클릭(진공 포켓 생성)으로 처리
    }
    isDragging = false;
  });

  // 마우스 휠 = 카메라 확대/축소 (원점을 향해 dolly)
  const ZOOM_TARGET = new THREE.Vector3(0, 0, 0);
  const ZOOM_MIN_DIST = 15;
  const ZOOM_MAX_DIST = 260;

  renderer.domElement.addEventListener('wheel', (event) => {
    event.preventDefault();
    const offset = camera.position.clone().sub(ZOOM_TARGET);
    const factor = 1 + event.deltaY * 0.001;
    let dist = offset.length() * factor;
    dist = Math.max(ZOOM_MIN_DIST, Math.min(ZOOM_MAX_DIST, dist));
    offset.setLength(dist);
    camera.position.copy(ZOOM_TARGET).add(offset);
    camera.lookAt(ZOOM_TARGET);
  }, { passive: false });

  // ---------- 초기화 ----------
  const clock = new THREE.Clock();
  let elapsedTime = 0;
  initExperiment_BoltzmannBrain(scene, elapsedTime);

  // ---------- 렌더 루프 ----------
  function animate() {
    requestAnimationFrame(animate);
    const deltaTime = clock.getDelta();
    elapsedTime += deltaTime;
    try {
      updateExperiment_BoltzmannBrain(elapsedTime, deltaTime);
    } catch (err) {
      panelEl.textContent = '오류 발생: ' + err.message;
      console.error(err);
    }
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
