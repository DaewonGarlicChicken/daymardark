<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Thought Experiment 002 - Bolzmann Brain</title>
<link rel="stylesheet" href="./template.css" />
<style>
  /* 이 페이지(볼츠만 두뇌)만의 스타일 - 공통 껍데기는 template.css에 있음 */
  canvas { display: block; opacity: 0; transition: opacity 1.2s ease; }
  body.started canvas { opacity: 1; }
</style>
</head>
<body>

<!-- 1. 시작 화면: 지시문 한 문장 -->
<div id="startScreen">
  <div class="ss-line">진공 속에서 뇌가 생겨나는 순간을 포착하라</div>
  <div class="ss-click">(화면을 클릭하세요)</div>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<!-- 공통 템플릿(제목바/목차/게임 UI) -->
<script src="./template.js"></script>

<!-- 함수 파일 -->
<script src="./boltzmann-brain.js"></script>
<script src="./boltzmann-brain-shape.js"></script>
<script src="./boltzmann-brain-scene.js"></script>

<script>
  initPageTemplate({ title: "Thought Experiment 0 0 2 - Bolzmann Brain", activeId: 2 });

  // ---------- 3. 설명 화면에 띄울 실험 원문 / 질문 ----------
  const ORIGINAL_HTML = `
    아무것도 없는 공간(진공)에서도<br>
    쌍생성과 쌍소멸이 끝없이 반복된다.<br>
    아주 낮은 확률로, 그 요동만으로<br>
    지능을 가진 뇌가 나타났다 사라질 수도 있다.`;
  const QUESTION = '어쩌면 우리의 의식은 방금 나타난 두뇌일지도 모른다';

  // ---------- 기본 씬 세팅 ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 95);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();
  let elapsedTime = 0;
  initExperiment_BoltzmannBrain(scene, elapsedTime);

  // ---------- 1 -> 2. 시작 화면 클릭 -> 지시문이 사라지고 진공이 생겨나며 게임 시작 ----------
  // 첫 클릭은 시작에만 쓰이고, 아래의 클릭/휠 동작으로는 전달되지 않음
  let started = false;
  function isUi(target) {
    return target && target.closest && target.closest('#menuToggleBtn, #tocSidebar, #gameHud, #gameResult');
  }
  window.addEventListener('mousedown', (event) => {
    if (started || isUi(event.target)) return;
    event.stopImmediatePropagation();
    if (event.button !== 0) return;
    started = true;
    const introEl = document.getElementById('startScreen');
    introEl.style.opacity = '0';
    setTimeout(() => { introEl.style.display = 'none'; }, 650);
    document.body.classList.add('started');
    GameUI.initHud({ goal: '뇌가 생성되는 순간을 클릭하라' });
    startGame_BoltzmannBrain(elapsedTime);
  }, true);
  window.addEventListener('wheel', (event) => {
    if (!started) event.stopImmediatePropagation();
  }, true);

  // ---------- 클릭: 진공 속 요동 중 "뇌"를 잡기 ----------
  let lastFeedback = { text: '', until: -1, warn: false };
  renderer.domElement.addEventListener('mousedown', (event) => {
    if (!started || event.button !== 0) return;
    const r = renderer.domElement.getBoundingClientRect();
    const nx = ((event.clientX - r.left) / r.width) * 2 - 1;
    const ny = -((event.clientY - r.top) / r.height) * 2 + 1;
    const res = pick_BoltzmannBrain(nx, ny, camera, r.width, r.height, elapsedTime);
    if (res === 'fluctuation') {
      lastFeedback = { text: '그건 잠깐의 요동일 뿐, 뇌가 아니다. (관측이 잠시 흐트러졌다)', until: elapsedTime + 1.4, warn: true };
    }
  });

  // 마우스 휠 = 카메라 확대/축소 (원점을 향해)
  const ZOOM_TARGET = new THREE.Vector3(0, 0, 0);
  renderer.domElement.addEventListener('wheel', (event) => {
    event.preventDefault();
    const offset = camera.position.clone().sub(ZOOM_TARGET);
    const dist = Math.max(45, Math.min(260, offset.length() * (1 + event.deltaY * 0.001)));
    offset.setLength(dist);
    camera.position.copy(ZOOM_TARGET).add(offset);
    camera.lookAt(ZOOM_TARGET);
  }, { passive: false });

  // ---------- 목표 패널 / 3. 설명 화면 ----------
  let resultShown = false;
  function updateHud() {
    if (!started) return;
    const g = getGame_BoltzmannBrain(elapsedTime);
    if (g.phase === 'forming') {
      GameUI.setStatus('뇌 안에 진공이 생겨나는 중...');
      GameUI.setHint('');
      return;
    }
    GameUI.setStatus(
      `관측 시간: <b>${g.observed.toFixed(1)}</b>초<br>` +
      `요동: <b>${g.fluctuations}</b>회` + (g.missed ? `<br>놓친 뇌: <b>${g.missed}</b>` : '')
    );
    if (g.won) {
      GameUI.setHint('');
      if (!resultShown) {
        resultShown = true;
        setTimeout(() => {
          GameUI.showResult({
            success: true,
            title: '목표 완료: 진공에서 생겨난 뇌를 포착했다',
            original: ORIGINAL_HTML,
            question: QUESTION,
            onRetry: () => { resultShown = false; resetGame_BoltzmannBrain(elapsedTime); },
          });
        }, 1400);
      }
      return;
    }
    if (elapsedTime < lastFeedback.until) GameUI.setHint(lastFeedback.text, lastFeedback.warn);
    else GameUI.setHint('진공 속 요동을 지켜보다가, 뇌 모양이 나타나면 클릭하세요.');
  }

  // ---------- 렌더 루프 ----------
  function animate() {
    requestAnimationFrame(animate);
    const deltaTime = clock.getDelta(); // 프레임당 한 번만 호출
    elapsedTime += deltaTime;
    updateExperiment_BoltzmannBrain(elapsedTime, deltaTime);
    updateHud();
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
