<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>이상한 사고실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  /* 처음 화면: 줄 그은 크림색 종이 전체 + 사고실험마다 색이 다른 폴더를 겹쳐 쌓은 서랍 */
  :root {
    --paper: #efe9dc;
    --paper-hi: #f7f3ea;
    --ink: #24221e;
    --ink-soft: #6f6a5f;
    --blue: #b7cddc;
    --blue-ink: #4f7390;
    --butter: #ece3a6;
    --pink: #dcb0ad;
    --salmon: #e2a487;
    --kraft: #c9a07a;
    --red: #b5523f;
    --mono: 'Courier Prime', 'Nanum Gothic Coding', monospace;
    --kmono: 'Nanum Gothic Coding', 'Courier Prime', monospace;
    --serif: 'Nanum Myeongjo', serif;
    --hand: 'Nanum Pen Script', cursive;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--kmono);
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, rgba(120, 108, 86, 0.18) 31px, rgba(120, 108, 86, 0.18) 32px);
  }
  /* 종이 결 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.3;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.36  0 0 0 0 0.3  0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    z-index: 50;
  }

  /* ---------- 위: 표지 ---------- */
  #cover {
    position: absolute;
    top: 7vh;
    left: 6vw;
    right: 6vw;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 30px;
    flex-wrap: wrap;
  }
  #cover .vol { font-family: var(--mono); font-size: 13px; letter-spacing: 0.24em; color: var(--ink-soft); }
  #title {
    margin: 10px 0 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(38px, 6vw, 76px);
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .subtitles { text-align: right; }
  .subtitle {
    margin: 0;
    font-family: var(--kmono);
    font-weight: 400;
    font-size: 14px;
    line-height: 1.9;
    color: var(--ink-soft);
  }
  /* 모두 클리어하면 표지 오른쪽 아래에 붙는 색인 카드 두 장 */
  #extras { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; min-height: 40px; }
  #extras a {
    display: inline-block;
    padding: 8px 16px 7px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-decoration: none;
    background: var(--butter);
    box-shadow: 1px 3px 8px rgba(0, 0, 0, 0.15);
    transform: rotate(-2deg);
    transition: transform 0.2s ease;
  }
  #extras a.records { background: var(--blue); transform: rotate(1.5deg); }
  #extras a:hover { transform: rotate(0) translateY(-3px); }
  #extras a.reveal { animation: extraIn 1.6s ease both; }
  #extras a.records.reveal { animation-delay: 0.35s; }
  @keyframes extraIn { 0% { opacity: 0; transform: translateY(14px) rotate(-8deg); } 60% { opacity: 1; } 100% { opacity: 1; } }

  #loading {
    position: absolute;
    left: 0;
    right: 0;
    top: 58vh;
    text-align: center;
    font-family: var(--mono);
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ---------- 아래: 겹쳐 쌓인 폴더 (사고실험 하나 = 폴더 하나) ---------- */
  #drawer {
    position: absolute;
    left: 6vw;
    right: 6vw;
    bottom: -60px;   /* 폴더 아랫부분은 화면 밖으로: 올라와도 밑이 비지 않게 */
    height: var(--drawer-h, 58vh);
  }
  .folder {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 6px 6px 0 0;
    box-shadow: 0 -2px 7px rgba(0, 0, 0, 0.13);
    text-decoration: none;
    color: var(--ink);
    opacity: 0;
    transform: translateY(40px);
    transition: transform 0.5s cubic-bezier(0.22, 0.9, 0.3, 1), filter 0.3s ease, box-shadow 0.4s ease;
  }
  /* 올라오는 애니메이션이 끝난 뒤에는 hover 움직임이 부드럽게 이어지도록 애니메이션을 떼어냄 */
  .folder.ready { opacity: 1; transform: none; animation: none; }
  .folder.show { animation: folderIn 0.7s ease forwards; }
  @keyframes folderIn { to { opacity: 1; transform: none; } }
  .folder.ready:hover { transform: translateY(-16px); filter: brightness(1.04); box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.18); }
  .folder:hover .tab { box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.12); }
  .folder .tab {
    position: absolute;
    z-index: 2;   /* 서류보다 앞 */
    top: 1px;
    transform: translateY(-100%);
    height: var(--tab-h, 40px);
    box-sizing: border-box;
    padding: 0 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-radius: 11px 11px 0 0;
    background: inherit;
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(12px, 1.15vw, 16px);
    letter-spacing: 0.06em;
    white-space: nowrap;
    box-shadow: 0 -3px 5px rgba(0, 0, 0, 0.07);
  }
  .folder .tab .no { font-weight: 400; color: rgba(36, 34, 30, 0.6); }
  .folder .tab .stamp {
    font-size: 0.72em;
    letter-spacing: 0.12em;
    color: var(--red);
    border: 1.5px solid var(--red);
    border-radius: 2px;
    padding: 0 5px;
    transform: rotate(-5deg);
  }
  .folder.disabled { cursor: default; filter: grayscale(0.6); }
  .folder.disabled:hover { transform: none !important; }

  /* ---------- 폴더 안의 서류 더미: 커서를 올리면 폴더와 함께 한 장씩 밀려 올라옴 ---------- */
  .folder .docs {
    position: absolute;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: 100%;              /* 폴더 윗변에서 잘려서, 폴더 속에서 나오는 것처럼 보임 */
    height: calc(var(--step, 64px) * 1.15);
    overflow: hidden;
    pointer-events: none;
  }
  .folder .sheet {
    position: absolute;
    bottom: 0;
    height: calc(var(--step, 64px) * 1.05);
    box-sizing: border-box;
    background-color: #faf7f0;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 13px, rgba(120, 108, 86, 0.16) 13px, rgba(120, 108, 86, 0.16) 14px);
    background-position: 0 30px;
    box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.12);
    transform: translateY(calc(100% + 14px)) rotate(0deg);   /* 클립까지 완전히 숨김 */
    transition: transform 0.55s cubic-bezier(0.22, 0.9, 0.3, 1);
  }
  /* 세 장: 맨 뒤 → 맨 앞. 폭·기울기·올라오는 높이를 조금씩 다르게 */
  .folder .sheet.s1 { left: 6%;  right: 9%;  background-color: #f1ece1; transition-delay: 0s; }
  .folder .sheet.s2 { left: 10%; right: 5%;  background-color: #f6f2e9; transition-delay: 0.05s; }
  .folder .sheet.s3 { left: 4%;  right: 12%; transition-delay: 0.1s; padding: 9px 16px 0; }
  .folder.ready:hover .sheet.s1 { transform: translateY(calc(var(--step, 64px) * 0.12)) rotate(-0.8deg); transition-delay: 0.08s; }
  .folder.ready:hover .sheet.s2 { transform: translateY(calc(var(--step, 64px) * 0.27)) rotate(0.6deg); transition-delay: 0.04s; }
  .folder.ready:hover .sheet.s3 { transform: translateY(calc(var(--step, 64px) * 0.44)) rotate(-0.3deg); transition-delay: 0s; }
  /* 맨 앞 장: 타자기로 친 머리글 + 클립 */
  .folder .sheet .sh-head {
    display: flex;
    gap: 14px;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .folder .sheet .sh-head b { color: var(--ink); letter-spacing: 0.08em; }
  /* 탭이 왼쪽에 있는 폴더는 머리글을 오른쪽에, 클립은 왼쪽에 (탭에 가리지 않게) */
  .folder.tab-left .sheet .sh-head { justify-content: flex-end; }
  .folder.tab-left .sheet .sh-clip { right: auto; left: 22%; transform: rotate(-6deg); }
  .folder .sheet .sh-clip {
    position: absolute;
    top: -8px;
    right: 18%;
    width: 12px;
    height: 34px;
    border: 2px solid #9a978f;
    border-radius: 8px;
    transform: rotate(6deg);
  }
  @media (prefers-reduced-motion: reduce) {
    .folder, .folder .sheet { transition-duration: 0.01s; }
  }
</style>
</head>
<body>
  <div id="cover">
    <div>
      <div class="vol">LAB. REPORT FILE — VOL.01</div>
      <h1 id="title">이상한 사고실험실</h1>
    </div>
    <div class="subtitles">
      <h2 class="subtitle">사고실험, 지식의 허영심을 드러내기에 좋은 요소.</h2>
      <h2 class="subtitle">이미지의 이해, 구상, 발현, 개시.</h2>
      <div id="extras"></div>
    </div>
  </div>

  <div id="loading">불러오는 중 . . .</div>
  <div id="drawer"></div>

  <!-- 사고실험 목록(THOUGHT_EXPERIMENTS)과 클리어 기록을 목차와 공유하기 위해 template.js를 불러옴 -->
  <script src="./template.js"></script>
  <script>
    // 폴더 색 (뒤에서 앞으로): 회색 / 분홍 / 밝은 종이 / 하늘 / 버터 / 크라프트 / 살구 / 연살구
    const FOLDER_COLORS = ['#d8d2c4', '#dcb0ad', '#f7f3ea', '#b7cddc', '#ece3a6', '#c9a07a', '#e2a487', '#e9c3a6'];
    // 탭 위치 (폴더 폭의 %): 번갈아 엇갈리게
    const TAB_X = [2, 46, 18, 58, 6, 40, 24, 62];

    const drawer = document.getElementById('drawer');
    const n = THOUGHT_EXPERIMENTS.length;
    function layout() {
      // 표지 아래 남는 공간을 폴더 더미가 채우도록 (화면 밖으로 숨는 60px 포함)
      const coverBottom = document.getElementById('cover').getBoundingClientRect().bottom;
      const H = Math.max(window.innerHeight * 0.5, window.innerHeight - coverBottom - 56) + 60;
      const step = Math.min(70, (H - 60) / (n + 1.0));
      const tabH = Math.min(44, step - 4);
      drawer.style.setProperty('--drawer-h', H + 'px');
      drawer.style.setProperty('--tab-h', tabH + 'px');
      drawer.style.setProperty('--step', step + 'px');
      [...drawer.children].forEach((el, i) => { el.style.height = (H - tabH - i * step) + 'px'; });
    }
    THOUGHT_EXPERIMENTS.forEach((exp, i) => {
      const el = document.createElement(exp.href ? 'a' : 'div');
      el.className = 'folder' + (exp.href ? '' : ' disabled');
      if (exp.href) el.href = exp.href;
      el.style.background = FOLDER_COLORS[i % FOLDER_COLORS.length];
      el.style.zIndex = String(i + 1);
      const name = (exp.title.split(': ').slice(1).join(': ') || exp.title).toUpperCase();
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.style.left = TAB_X[i % TAB_X.length] + '%';
      if (TAB_X[i % TAB_X.length] < 30) el.classList.add('tab-left');
      tab.innerHTML = `<span class="no">No.${String(exp.id).padStart(3, '0')}</span><span class="nm"></span>`;
      tab.querySelector('.nm').textContent = name;
      if (GameProgress.isCleared(exp.id)) tab.insertAdjacentHTML('beforeend', '<span class="stamp">CLEARED</span>');
      el.appendChild(tab);
      // 폴더 속 서류 세 장 (맨 앞 장에는 보고서 머리글과 클립)
      const docs = document.createElement('div');
      docs.className = 'docs';
      docs.innerHTML = '<div class="sheet s1"></div><div class="sheet s2"></div>'
        + `<div class="sheet s3"><span class="sh-clip"></span><div class="sh-head"><span>REPORT No.${String(exp.id).padStart(3, '0')}</span><b></b></div></div>`;
      docs.querySelector('.sh-head b').textContent = name;
      el.appendChild(docs);
      drawer.appendChild(el);
    });
    layout();
    window.addEventListener('resize', layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

    // 잠깐 "불러오는 중" 뒤에 폴더가 아래에서부터 차례로 올라옴
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      [...drawer.children].forEach((el, i) => {
        el.style.animationDelay = (i * 0.07) + 's';
        el.classList.add('show');
        el.addEventListener('animationend', () => { el.classList.remove('show'); el.classList.add('ready'); }, { once: true });
      });
    }, 2000);

    // 8개를 모두 클리어했으면 표지 오른쪽에 [무한모드], [기록]
    const extras = document.getElementById('extras');
    function addInfiniteItem(reveal) {
      if (extras.querySelector('a')) return;
      [INFINITE_MODE, RECORDS_PAGE].forEach((page, i) => {
        const a = document.createElement('a');
        a.href = page.href;
        a.textContent = page.title;
        a.className = 'infiniteItem' + (i > 0 ? ' records recordsItem' : '');
        if (reveal) a.classList.add('reveal'); // 방금 열렸으면 떠오르는 연출
        extras.appendChild(a);
      });
    }
    if (GameProgress.allCleared()) addInfiniteItem(GameProgress.consumeJustUnlocked());
    // 숨은 커맨드(← → ← → B)로 열렸을 때
    window.addEventListener('tel-unlocked', () => {
      addInfiniteItem(true);
      drawer.querySelectorAll('.tab').forEach((t) => { if (!t.querySelector('.stamp')) t.insertAdjacentHTML('beforeend', '<span class="stamp">CLEARED</span>'); });
    });
  </script>
</body>
</html>
