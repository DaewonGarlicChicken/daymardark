<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Thought Experiment ∞ - Infinite Mode</title>
<link rel="stylesheet" href="./template.css" />
<style>
  /* 이 페이지(무한모드)만의 스타일 - 책상 위 보고서 종이, 제목바, 목차는 template.css */
  canvas { display: block; opacity: 0; transition: opacity 0.8s ease; }
  body.started canvas { opacity: 1; }
  #startScreen a { pointer-events: auto; color: var(--red); text-decoration: none; }
  #startScreen a:hover { text-decoration: underline; }

  /* ---------- 왼쪽 위: 단계 / 목숨 (테이프로 붙인 메모지) ---------- */
  #infHud {
    position: fixed;
    top: calc(var(--sheet-top) + 86px);
    left: calc(var(--sheet-left) + 80px);
    z-index: 7;
    padding: 12px 18px 12px;
    background: var(--butter);
    color: var(--ink);
    box-shadow: 2px 5px 12px rgba(0, 0, 0, 0.2);
    transform: rotate(-1.4deg);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #infHud::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    width: 64px;
    height: 20px;
    margin-left: -32px;
    background: rgba(247, 243, 230, 0.72);
    transform: rotate(3deg);
  }
  #infHud.show { opacity: 1; }
  #infHud .ih-stage { font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; color: var(--ink-soft); }
  #infHud .ih-stage b { font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; margin-left: 6px; font-variant-numeric: tabular-nums; }
  #infHud .ih-lives { margin-top: 6px; }
  #infHud .life { border-left-width: 9px; border-right-width: 9px; border-bottom-width: 15px; margin: 0 4px 0 0; }

  /* 목숨 = 먹색 삼각형 */
  .life {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-bottom: 27px solid var(--ink);
    margin: 0 8px;
    transition: border-bottom-color 0.3s ease;
  }
  .life.lost { border-bottom-color: rgba(36, 34, 30, 0.14); }
  .life.breaking { animation: lifeBreak 0.9s ease; }
  @keyframes lifeBreak {
    0% { border-bottom-color: var(--red); transform: scale(1.35); }
    20% { transform: translateX(-5px) rotate(-12deg) scale(1.2); }
    40% { transform: translateX(5px) rotate(10deg); }
    60% { transform: translateX(-3px) rotate(-6deg); border-bottom-color: var(--red); }
    100% { border-bottom-color: rgba(36, 34, 30, 0.14); transform: none; }
  }

  /* ---------- 막간 화면: 새 보고서 한 장 (단계 번호 / 목숨 / 다음 실험) ---------- */
  #infInter {
    position: fixed;
    top: var(--sheet-top);
    right: var(--sheet-right);
    bottom: var(--sheet-bottom);
    left: var(--sheet-left);
    z-index: 6;               /* 제목바(8)는 그대로 보임 */
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 71px, var(--margin-line) 71px, var(--margin-line) 72px, transparent 72px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
    background-position: 0 0, 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  #infInter.show { opacity: 1; }
  #infInter .ii-label { font-family: var(--mono); font-size: 14px; letter-spacing: 0.5em; color: var(--ink-soft); margin-left: 0.5em; }
  #infInter .ii-stage { font-family: var(--mono); font-weight: 700; font-size: 120px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #infInter.show .ii-stage { animation: stagePop 0.5s ease; }
  #infInter .ii-lives { margin: 18px 0 26px; }
  #infInter .ii-next { font-family: var(--mono); font-size: 17px; color: var(--ink); }
  #infInter .ii-next .in-num { color: var(--ink-soft); margin-right: 8px; }
  #infInter .ii-speed { display: none; font-family: var(--serif); font-weight: 700; font-size: 70px; color: var(--red); }
  #infInter .ii-speed .is-sub { font-family: var(--mono); font-weight: 400; font-size: 20px; margin-top: 14px; color: var(--ink); }
  #infInter.speedOn .ii-main { display: none; }
  #infInter.speedOn .ii-speed { display: block; animation: speedPop 0.6s ease; }
  @keyframes stagePop { from { transform: scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes speedPop {
    0% { transform: scale(0.6) rotate(-6deg); opacity: 0; }
    60% { transform: scale(1.12) rotate(2deg); opacity: 1; }
    100% { transform: none; }
  }

  /* ---------- 명령어: 처음엔 화면 가운데 크게 -> 게임이 시작되면 위로 작게 ---------- */
  #infCommand {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 7;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: top 0.3s ease, transform 0.3s ease, opacity 0.2s ease;
    text-shadow: 0 0 14px var(--paper), 0 0 6px var(--paper), 0 0 2px var(--paper);
  }
  #infCommand.show { opacity: 1; }
  #infCommand .ic-word { font-family: var(--serif); font-weight: 700; font-size: 78px; letter-spacing: -0.01em; }
  #infCommand.show:not(.top) .ic-word { animation: cmdPop 0.45s ease; }
  #infCommand .ic-hint { margin-top: 10px; font-family: var(--kmono); font-size: 17px; color: var(--ink-soft); transition: opacity 0.2s ease; }
  #infCommand.top { top: calc(var(--sheet-top) + 108px); transform: translate(-50%, -50%) scale(0.42); }
  #infCommand.top .ic-hint { opacity: 0; }
  @keyframes cmdPop {
    0% { transform: scale(1.8) rotate(-4deg); opacity: 0; }
    55% { transform: scale(0.94) rotate(1deg); opacity: 1; }
    100% { transform: none; }
  }

  /* ---------- 성공 / 실패: 도장처럼 쾅 ---------- */
  #infFlash {
    position: fixed;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 7;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 80px;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 16px var(--paper), 0 0 6px var(--paper);
  }
  #infFlash.show { opacity: 1; animation: flashPop 0.5s ease; }
  #infFlash .if-why { font-family: var(--kmono); font-weight: 700; font-size: 19px; margin-top: 6px; text-align: center; color: var(--ink); white-space: nowrap; }
  #infFlash.win { color: var(--blue-ink); }
  #infFlash.fail { color: var(--red); }
  @keyframes flashPop {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.15) rotate(2deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* ---------- 게임 오버 기록 ---------- */
  .infOver .io-big { font-size: 20px; color: var(--ink); }
  .infOver .io-big b { font-family: var(--mono); font-size: 56px; font-weight: 700; color: var(--red); margin-right: 6px; }
  .infOver .io-sub { margin-top: 10px; color: var(--ink-soft); }
  .infOver .io-new { color: var(--red); font-weight: 700; }

  /* ---------- 미니게임 위의 글자 요소: 원래 페이지와 같은 모양 ---------- */
  #infLayer { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  /* 중국어 방: 심사관 말풍선 */
  .infExaminer {
    position: fixed; display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--ink); pointer-events: none;
  }
  .infExaminer .ex-name { font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; color: var(--ink-soft); }
  .infExaminer .ex-bubble {
    position: relative; width: 140px; height: 124px;
    border: 1.5px solid var(--ink); border-radius: 14px; background: var(--paper-hi);
    box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .infExaminer .ex-bubble::after {
    content: ''; position: absolute; bottom: -9px; left: calc(50% - 8px); width: 16px; height: 16px;
    background: var(--paper-hi);
    border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    transform: rotate(45deg);
  }
  .infExaminer svg { width: 100px; height: 100px; display: block; }
  .infExaminer polygon[fill="#f2efe2"] { fill: var(--ink); }
  .infExaminer polygon[fill^="rgba"] { fill: rgba(36, 34, 30, 0.1); }
  .infExaminer .ex-text { font-family: var(--hand); font-size: 48px; }
  .infExaminer .ex-text.ok { color: var(--green); font-size: 30px; }
  .infExaminer .ex-bar { order: -1; width: 140px; height: 3px; background: rgba(36, 34, 30, 0.14); border-radius: 2px; overflow: hidden; }
  .infExaminer .ex-bar > div { height: 100%; width: 0; background: var(--ink); }
  .infExaminer .ex-bar.warn > div { background: var(--red); }
  /* 트롤리 딜레마: 손 위 스톱워치 / 무리 아래 이름표 */
  .infStopwatch {
    position: fixed; transform: translate(-50%, -100%); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 30px;
    letter-spacing: 0.06em; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .infGroupLabel {
    position: fixed; transform: translate(-50%, 0); color: var(--ink); font-family: var(--kmono); font-size: 17px;
    white-space: nowrap; text-align: center; transition: color 0.2s ease;
  }
  .infGroupLabel .gl-sub { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .infGroupLabel.hover .gl-sub { color: var(--blue-ink); font-weight: 700; }
  .infGroupLabel.saved .gl-sub { color: var(--green); font-weight: 700; }
  .infGroupLabel.lost .gl-sub { color: var(--red); font-weight: 700; }
  /* 뷔리당의 당나귀: 건초 / 물 이름표 */
  .infSideLabel {
    position: fixed; bottom: calc(var(--sheet-bottom) + 40px); color: var(--ink); font-family: var(--kmono); font-weight: 700; font-size: 19px; opacity: 0.85;
    transition: color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
  }
  .infSideLabel.left { left: calc(var(--sheet-left) + 10vw); }
  .infSideLabel.right { right: calc(var(--sheet-right) + 10vw); }
  .infSideLabel.hit { color: var(--red); transform: scale(1.12); opacity: 1; }
  /* 양자 자살과 불멸: 살아남은 이유 */
  .infFigLabel {
    position: fixed; transform: translate(-50%, -100%); color: var(--ink); font-family: var(--hand); font-size: 22px; white-space: nowrap;
  }
</style>
</head>
<body>

<!-- 1. 시작 화면 -->
<div id="startScreen">
  <div class="ss-line" id="ssLine">목숨 세 개로, 사고실험들을 끝없이 버텨라</div>
  <div class="ss-click" id="ssClick">(화면을 클릭하세요)</div>
</div>

<!-- 왼쪽 위: 단계 / 목숨 -->
<div id="infHud">
  <div class="ih-stage">STAGE<b id="ihStage">1</b></div>
  <div class="ih-lives" id="ihLives"></div>
</div>

<!-- 막간 화면 -->
<div id="infInter">
  <div class="ii-speed" id="iiSpeed"></div>
  <div class="ii-main">
    <div class="ii-label">STAGE</div>
    <div class="ii-stage" id="iiStage">01</div>
    <div class="ii-lives" id="iiLives"></div>
    <div class="ii-next" id="iiNext"></div>
  </div>
</div>

<!-- 명령어 / 성공·실패 -->
<div id="infCommand"><div class="ic-word" id="icWord"></div><div class="ic-hint" id="icHint"></div></div>
<div id="infFlash"></div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<!-- 공통 템플릿(제목바/목차/게임 UI/클리어 기록) -->
<script src="./template.js"></script>

<!-- 8개 사고실험 페이지의 도형/색/설정 (무한모드가 그대로 가져다 씀) -->
<script src="./theseus-galley.js"></script>
<script src="./boltzmann-brain-shape.js"></script>
<script src="./boltzmann-brain-scene.js"></script>
<script src="./chinese-room-shape.js"></script>
<script src="./chinese-room.js"></script>
<script src="./trolley-shape.js"></script>
<script src="./trolley.js"></script>
<script src="./monkey.js"></script>
<script src="./buridan-shape.js"></script>
<script src="./buridan.js"></script>
<script src="./quantum.js"></script>
<script src="./maxwell.js"></script>

<!-- 무한모드 (미니게임 8종 + 진행) -->
<script src="./infinite-mode.js"></script>

<script>
  initPageTemplate({
    title: 'Thought Experiment ∞ - Infinite Mode',
    activeId: INFINITE_MODE.id,
    header: { left: 'REPORT No.∞', center: 'Infinite Mode', right: 'APPENDIX' },
  });

  // ---------- 기본 씬 세팅 ----------
  const scene = new THREE.Scene();
  const FOV = 50;
  const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 5, 1000); // 앞쪽 경계를 멀리 둬서 깊이 정밀도를 높임
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // 게임 상자(가로 64 x 세로 36)가 제목바 선 아래 남은 화면에 꽉 차도록 카메라 배치
  const view = { halfH: 20, halfW: 35, camY: 0, ppu: 20, dist: 45 };
  function fitCamera() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    const tanH = Math.tan((FOV * Math.PI / 180) / 2);
    const bar = document.getElementById('topBar');
    const fTop = bar ? (bar.getBoundingClientRect().bottom + 10) / window.innerHeight : 0.12;
    const fBot = 30 / window.innerHeight; // 종이 아래 여백만큼
    const usable = 1 - fTop - fBot;
    const dist = Math.max(18 / (tanH * usable), 32.5 / (tanH * camera.aspect)) * 1.02;
    view.halfH = dist * tanH;
    view.halfW = view.halfH * camera.aspect;
    view.camY = -(fBot - fTop) * view.halfH;   // 상자 가운데(y=0)가 남은 화면의 가운데에 오도록
    view.ppu = window.innerHeight / (2 * view.halfH);
    view.dist = dist;
    camera.position.set(0, view.camY, dist);
    camera.lookAt(0, view.camY, 0);
  }
  fitCamera();
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    fitCamera();
  });

  // 화면 좌표 -> 게임 상자 좌표 (z = 0 평면)
  function toWorld(event) {
    const nx = (event.clientX / window.innerWidth) * 2 - 1;
    const ny = -(event.clientY / window.innerHeight) * 2 + 1;
    return [nx * view.halfW, view.camY + ny * view.halfH];
  }

  // ---------- 진행 준비 ----------
  const $ = (id) => document.getElementById(id);
  InfiniteMode.init({
    scene,
    px: (n) => n / view.ppu,
    view,
    dom: {
      hud: $('infHud'), stage: $('ihStage'), lives: $('ihLives'),
      inter: $('infInter'), interStage: $('iiStage'), interLives: $('iiLives'), interNext: $('iiNext'), interSpeed: $('iiSpeed'),
      command: $('infCommand'), cmdWord: $('icWord'), cmdHint: $('icHint'), flash: $('infFlash'),
    },
  });

  const clock = new THREE.Clock();
  let elapsedTime = 0;

  // ---------- 게임 오버: 몇 단계까지 통과했는지 ----------
  InfiniteMode.onGameOver = (r) => {
    GameUI.showResult({
      success: false,
      title: '게임 오버',
      original:
        `<div class="infOver">` +
        `<div class="io-big"><b>${r.passed}</b>단계까지 통과했다</div>` +
        `<div class="io-sub">성공한 게임 ${r.wins}개 · 최고 기록 ${r.best}단계` +
        (r.newBest && r.passed > 0 ? ` <span class="io-new">(새 기록!)</span>` : '') + `</div>` +
        (r.test ? `<div class="io-sub">확인용 주소로 시작해서 최고 기록에는 넣지 않았다</div>` : '') +
        `</div>`,
      retryText: '다시 하기',
      onRetry: () => InfiniteMode.restart(elapsedTime),
      extra: { text: '처음 화면으로', href: 'index.html' },
    });
  };

  // 확인용 주소 옵션: infinite-mode.html?game=3&stage=21 -> 3번 게임만 21단계부터 (game 생략하면 전부)
  const query = new URLSearchParams(window.location.search);
  const startOpts = { only: Number(query.get('game')) || 0, stage: Number(query.get('stage')) || 1 };

  // ---------- 1. 시작 화면 (모든 사고실험을 클리어해야 열림) ----------
  const unlocked = GameProgress.allCleared();
  var INFINITE_PAGE_LOCKED = !unlocked; // 잠긴 화면에서 ← → ← → B를 입력하면 새로고침해서 열림
  if (!unlocked) {
    $('ssLine').textContent = '모든 사고실험을 클리어하면 열린다';
    $('ssClick').innerHTML = '<a href="index.html">처음 화면으로</a>';
  }
  let started = false;
  function isUi(target) {
    return target && target.closest && target.closest('#menuToggleBtn, #tocSidebar, #gameResult, #startScreen a');
  }
  window.addEventListener('pointerdown', (event) => {
    if (started || !unlocked || isUi(event.target)) return;
    event.stopImmediatePropagation(); // 첫 클릭은 시작에만 사용
    if (event.button !== 0) return;
    started = true;
    const introEl = $('startScreen');
    introEl.style.opacity = '0';
    setTimeout(() => { introEl.style.display = 'none'; }, 650);
    document.body.classList.add('started');
    InfiniteMode.start(elapsedTime, startOpts);
  }, true);

  // ---------- 2. 게임 입력 ----------
  renderer.domElement.addEventListener('pointerdown', (event) => {
    if (!started || event.button !== 0) return;
    const [wx, wy] = toWorld(event);
    InfiniteMode.pointerDown(wx, wy);
  });
  renderer.domElement.addEventListener('pointermove', (event) => {
    if (!started) return;
    const [wx, wy] = toWorld(event);
    InfiniteMode.pointerMove(wx, wy);
    renderer.domElement.style.cursor = InfiniteMode.isPlaying() ? 'pointer' : 'default';
  });

  // ---------- 렌더 루프 ----------
  function animate() {
    requestAnimationFrame(animate);
    const deltaTime = Math.min(0.1, clock.getDelta()); // 프레임당 한 번만 호출 (탭 전환 후 큰 값은 자름)
    elapsedTime += deltaTime;
    InfiniteMode.update(elapsedTime, deltaTime);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
