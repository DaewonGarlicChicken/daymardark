<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Thought Experiment - Records</title>
<link rel="stylesheet" href="./template.css" />
<style>
  /* 이 페이지(기록)만의 스타일 - 책상 위 보고서 종이는 template.css (실험 기록부) */
  #recWrap {
    position: fixed;
    top: calc(var(--sheet-top) + 84px);
    left: calc(var(--sheet-left) + 70px);
    right: calc(var(--sheet-right) + 26px);
    bottom: var(--sheet-bottom);
    z-index: 3;
    overflow-y: auto;
    padding: 18px 8px 56px;
    box-sizing: border-box;
    color: var(--ink);
    word-break: keep-all;
  }
  .rec-inner { width: min(1120px, 100%); margin: 0 auto; }

  /* 맨 위: 전체 합계 (타자기로 친 한 줄) */
  #recTotal {
    display: flex;
    justify-content: flex-end;
    gap: 34px;
    flex-wrap: wrap;
    font-family: var(--mono);
    margin-bottom: 46px;
    opacity: 0;
    animation: recIn 0.9s ease forwards;
  }
  #recTotal .rt-item { display: flex; align-items: baseline; gap: 10px; }
  #recTotal .rt-label { font-family: var(--kmono); font-size: 13px; color: var(--ink-soft); }
  #recTotal .rt-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 사고실험 하나 = 탭 달린 기록 카드 하나 */
  #recGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 54px 20px;
  }
  @media (max-width: 1080px) { #recGrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { #recGrid { grid-template-columns: 1fr; } }
  .rec-box {
    position: relative;
    padding: 18px 18px 12px;
    background: var(--paper-hi);
    box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.16);
    opacity: 0;
    transform: translateY(10px);
    animation: recIn 0.8s ease forwards;
  }
  @keyframes recIn { to { opacity: 1; transform: none; } }
  .rec-box .rec-tab {
    position: absolute;
    top: 1px;
    left: 14px;
    transform: translateY(-100%);
    padding: 6px 14px 4px;
    border-radius: 7px 7px 0 0;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
  }
  .rec-name { font-family: var(--serif); font-size: 19px; font-weight: 700; }
  .rec-en { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .rec-stats { margin-top: 12px; }
  .rec-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 14px; border-bottom: 1px dashed rgba(36, 34, 30, 0.2); }
  .rec-row:last-child { border-bottom: none; }
  .rec-row .rl { color: var(--ink-soft); }
  .rec-row .rv { font-family: var(--mono); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec-none { margin-top: 14px; padding: 12px 0 6px; font-family: var(--hand); font-size: 22px; color: var(--ink-soft); }

  /* 마지막 문구 (손글씨) */
  #recClosing {
    margin: 64px auto 0;
    width: min(800px, 100%);
    text-align: center;
    font-family: var(--hand);
    font-size: 34px;
    line-height: 1.4;
    color: var(--blue-ink);
    opacity: 0;
    animation: recIn 1.4s ease forwards;
  }
  #recButtons { margin-top: 34px; text-align: center; opacity: 0; animation: recIn 1s ease forwards; }
  #recButtons a {
    display: inline-block;
    padding: 9px 24px;
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper-hi);
    font-family: var(--kmono);
    font-weight: 700;
    font-size: 14px;
    border-radius: 3px;
    text-decoration: none;
  }
  #recButtons a:hover { background: #3a3732; }

  /* 아직 다 클리어하지 않았을 때 */
  #recLocked { display: none; }
  body.locked #recWrap { display: none; }
  body.locked #recLocked { display: block; }
  #recLocked a { pointer-events: auto; color: var(--red); text-decoration: none; }
  #recLocked a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 잠긴 화면 (시작 화면과 같은 모양) -->
<div id="startScreen" class="recLockedScreen">
  <div id="recLocked">
    <div class="ss-line">모든 사고실험을 클리어하면 열린다</div>
    <div class="ss-click"><a href="index.html">처음 화면으로</a></div>
  </div>
</div>

<div id="recWrap">
  <div class="rec-inner">
    <div id="recTotal"></div>
    <div id="recGrid"></div>
    <div id="recClosing"></div>
    <div id="recButtons">
      <a class="primary" href="index.html">처음 화면으로</a>
    </div>
  </div>
</div>

<!-- 공통 템플릿(제목바/목차/클리어 기록/플레이 기록) -->
<script src="./template.js"></script>
<script>
  // =========================================================
  // 마지막 문구: 여기에 원하는 문구를 적으면 됨 (줄바꿈은 <br>)
  // =========================================================
  const CLOSING_TEXT = '잘 이해할 수 있는 시간이 되었길 바래요.';

  initPageTemplate({
    title: 'Thought Experiment - Records',
    activeId: RECORDS_PAGE.id,
    header: { left: 'LAB. RECORD', center: '실험 기록부', right: `${THOUGHT_EXPERIMENTS.length} REPORTS` },
  });

  // 박스에 붙는 한국어 이름
  const KOREAN_NAMES = {
    1: '테세우스의 배', 2: '볼츠만 두뇌', 3: '중국어 방', 4: '트롤리 딜레마',
    5: '무한 원숭이 정리', 6: '뷔리당의 당나귀', 7: '양자 자살과 불멸', 8: '맥스웰의 악마',
  };

  // 걸린 시간: 1분 미만이면 "42.3초", 넘으면 "3분 07초"
  function formatTime(sec) {
    if (sec < 60) return sec.toFixed(1) + '초';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}분 ${String(s).padStart(2, '0')}초`;
  }
  function formatCount(n, unit) { return n.toLocaleString('ko-KR') + unit; }

  // 카드 탭 색 (처음 화면의 폴더 색과 같은 순서)
  const TAB_COLORS = ['#d8d2c4', '#dcb0ad', '#ece6d6', '#b7cddc', '#ece3a6', '#c9a07a', '#e2a487', '#e9c3a6'];

  // 확인용 주소 옵션: records.html?sample -> 그럴듯한 가짜 기록으로 화면 보기 (실제 기록은 바뀌지 않음)
  const SAMPLE = /[?&]sample\b/.test(window.location.search);

  var RECORDS_PAGE_LOCKED = !GameProgress.allCleared() && !SAMPLE;
  if (RECORDS_PAGE_LOCKED) {
    document.body.classList.add('locked');
  } else {
    const grid = document.getElementById('recGrid');
    let totalTime = 0, totalRetries = 0, totalClicks = 0, hasAny = false;
    THOUGHT_EXPERIMENTS.forEach((exp, i) => {
      const r = SAMPLE
        ? { time: 25 + Math.random() * 200, retries: Math.floor(Math.random() * 6), clicks: 10 + Math.floor(Math.random() * 300) }
        : GameStats.get(exp.id);
      const parts = exp.title.split(': ');
      const box = document.createElement('div');
      box.className = 'rec-box';
      box.style.animationDelay = (0.25 + i * 0.12) + 's';
      let html = `<div class="rec-tab" style="background:${TAB_COLORS[i % TAB_COLORS.length]}">No.${String(exp.id).padStart(3, '0')}</div>` +
        `<div class="rec-name">${KOREAN_NAMES[exp.id] || parts[1] || exp.title}</div>` +
        `<div class="rec-en">${parts[1] || ''}</div>`;
      if (r) {
        hasAny = true;
        totalTime += r.time; totalRetries += r.retries; totalClicks += r.clicks;
        html += '<div class="rec-stats">' +
          `<div class="rec-row"><span class="rl">걸린 시간</span><span class="rv">${formatTime(r.time)}</span></div>` +
          `<div class="rec-row"><span class="rl">재도전 횟수</span><span class="rv">${formatCount(r.retries, '회')}</span></div>` +
          `<div class="rec-row"><span class="rl">클릭 횟수</span><span class="rv">${formatCount(r.clicks, '회')}</span></div>` +
          '</div>';
      } else {
        // 숨은 커맨드로 열었거나, 기록이 남지 않은 경우
        html += '<div class="rec-none">남은 기록이 없다</div>';
      }
      box.innerHTML = html;
      grid.appendChild(box);
    });

    // 전체 합계
    const total = document.getElementById('recTotal');
    total.innerHTML = hasAny
      ? `<div class="rt-item"><div class="rt-label">전체 시간</div><div class="rt-value">${formatTime(totalTime)}</div></div>` +
        `<div class="rt-item"><div class="rt-label">전체 재도전</div><div class="rt-value">${formatCount(totalRetries, '회')}</div></div>` +
        `<div class="rt-item"><div class="rt-label">전체 클릭</div><div class="rt-value">${formatCount(totalClicks, '회')}</div></div>`
      : '';

    // 마지막 문구와 버튼은 박스가 다 나타난 뒤에
    const after = 0.25 + THOUGHT_EXPERIMENTS.length * 0.12 + 0.5;
    const closing = document.getElementById('recClosing');
    closing.innerHTML = CLOSING_TEXT;
    closing.style.animationDelay = after + 's';
    document.getElementById('recButtons').style.animationDelay = (after + 0.8) + 's';
  }
</script>
</body>
</html>
