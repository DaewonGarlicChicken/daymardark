<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Thought Experiment 001 - Theseus's Ship</title>
<link rel="stylesheet" href="./template.css" />
<style>
  /* 이 페이지(테세우스의 배)만의 스타일 - 공통 껍데기는 template.css에 있음 */
  canvas { display: block; opacity: 0; transition: opacity 1.2s ease; }
  body.started canvas { opacity: 1; }
</style>
</head>
<body>

<!-- 1. 시작 화면: 지시문 한 문장 -->
<div id="startScreen">
  <div class="ss-line">부서지는 판자를 고치며 30초 동안 항해를 완주하라</div>
  <div class="ss-click">(화면을 클릭하세요)</div>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<!-- 공통 템플릿(제목바/목차/게임 UI) -->
<script src="./template.js"></script>

<!-- 함수 파일 -->
<script src="./theseus-galley.js"></script>

<script>
  initPageTemplate({ title: "Thought Experiment 0 0 1 - Theseus's Ship", activeId: 1 });

  const SHIP_COLOR = 0xdd8844;

  // ---------- 3. 설명 화면에 띄울 실험 원문 / 질문 ----------
  const ORIGINAL_HTML = `
    테세우스의 배가 있다. 판자가 고장나고,<br>
    그는 배를 수리하기 위해 판자를 갈아끼운다.<br>
    그렇게 원래 있던 판자가 전부 교체되었다.`;
  const QUESTION = '원래의 테세우스의 배라 할 수 있는 것은 무엇인가?';

  // ---------- 기본 씬 세팅 ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 33, 130);
  camera.lookAt(0, 3, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const clock = new THREE.Clock();
  let elapsedTime = 0;

  setScene_TheseusGalley(scene);

  // ---------- 1 -> 2. 시작 화면 클릭 -> 지시문이 사라지고 배가 들어오며 게임 시작 ----------
  // 첫 클릭은 시작에만 쓰이고, 아래의 수리 클릭/휠 동작으로는 전달되지 않음
  let started = false;
  function isUi(target) {
    return target && target.closest && target.closest('#menuToggleBtn, #tocSidebar, #gameHud, #gameResult');
  }
  window.addEventListener('mousedown', (event) => {
    if (started || isUi(event.target)) return;
    event.stopImmediatePropagation();
    if (event.button !== 0) return;
    started = true;
    const introEl = document.getElementById('startScreen');
    introEl.style.opacity = '0';
    setTimeout(() => { introEl.style.display = 'none'; }, 650);
    document.body.classList.add('started');
    GameUI.initHud({ goal: '항해를 완주하라' });
    startGame_TheseusGalley(SHIP_COLOR, elapsedTime);
  }, true);
  window.addEventListener('wheel', (event) => {
    if (!started) event.stopImmediatePropagation();
  }, true);

  // ---------- 클릭(수리) / 휠(줌) ----------
  // 시작 클릭은 위의 캡처 리스너가 막으므로 수리로 이어지지 않음
  renderer.domElement.addEventListener('mousedown', (event) => {
    if (!started || event.button !== 0) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(getRaycastTargets_TheseusGalley());
    if (hits.length > 0) handleRaycastHit_TheseusGalley(hits[0], elapsedTime);
  });

  const ZOOM_TARGET = new THREE.Vector3(0, 3, 0);
  renderer.domElement.addEventListener('wheel', (event) => {
    event.preventDefault();
    const offset = camera.position.clone().sub(ZOOM_TARGET);
    const dist = Math.max(35, Math.min(420, offset.length() * (1 + event.deltaY * 0.001)));
    offset.setLength(dist);
    camera.position.copy(ZOOM_TARGET).add(offset);
    camera.lookAt(ZOOM_TARGET);
  }, { passive: false });

  // ---------- 결과 (3. 설명 화면 / 실패 화면) ----------
  function retry() {
    startGame_TheseusGalley(SHIP_COLOR, elapsedTime);
  }

  THESEUS_GALLEY_CONFIG.onWin = () => {
    GameUI.showResult({
      success: true,
      title: '목표 완료: 항해를 완주했다',
      original: ORIGINAL_HTML,
      question: QUESTION,
      onRetry: retry,
    });
  };

  THESEUS_GALLEY_CONFIG.onSunk = (reason) => {
    GameUI.showResult({
      success: false,
      title: '배가 가라앉았다',
      original: reason === 'overload'
        ? '고장 난 부위가 3개를 넘었습니다.'
        : '고장 난 부위를 5초 안에 고치지 못했습니다.',
      retryText: '다시 하기',
      onRetry: retry,
    });
  };

  // ---------- 목표 패널 ----------
  function updateHud() {
    if (!started) return;
    const g = getGame_TheseusGalley(elapsedTime);
    if (g.phase === 'entering') {
      GameUI.setStatus('배가 들어오는 중...');
      GameUI.setHint('');
      return;
    }
    GameUI.setStatus(
      `항해: <b>${g.sailed.toFixed(1)}</b> / ${g.goal}초<br>` +
      `고장 난 부위: <b>${g.broken}</b> / ${g.maxBroken}<br>` +
      `교체된 부위: <b>${g.replaced}</b> / ${g.regionCount}`
    );
    if (g.phase !== 'active') { GameUI.setHint(''); return; }
    if (g.broken === 0) {
      GameUI.setHint('어둡게 변한 부위를 클릭해 새 판자로 교체하세요.');
    } else {
      const warn = g.minLeft < 2 || g.broken >= g.maxBroken;
      GameUI.setHint(`가장 급한 부위: ${g.minLeft.toFixed(1)}초 안에 수리`, warn);
    }
  }

  // ---------- 화면 계산 ----------
  function getViewHalfWidthAtZ0(cam) {
    const vFOV = (cam.fov * Math.PI) / 180;
    return Math.tan(vFOV / 2) * cam.position.z * cam.aspect;
  }

  // ---------- 렌더 루프 ----------
  function animate() {
    requestAnimationFrame(animate);
    const deltaTime = clock.getDelta(); // 프레임당 한 번만 호출
    elapsedTime += deltaTime;
    updateExperiment_TheseusGalley(elapsedTime, deltaTime, getViewHalfWidthAtZ0(camera));

    updateHud();
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
